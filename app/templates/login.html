<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Cotizador Odoo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h4 class="mb-1 fw-bold text-primary">Cotizador Odoo</h4>
                        <p class="text-muted small mb-4">Ingresá con tu usuario y contraseña de Odoo</p>
                        {% if error %}
                        <div class="alert alert-danger py-2 small">{{ error }}</div>
                        {% endif %}
                        <form method="post" action="/login">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Email / Usuario Odoo</label>
                                <input type="text" name="username" class="form-control"
                                    placeholder="usuario@argelec.com.ar" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Contraseña</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-semibold">Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
